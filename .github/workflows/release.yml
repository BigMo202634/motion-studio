# Publishing an update:
#   1. bump the version in plugins/motion-studio/.claude-plugin/plugin.json, .claude-plugin/marketplace.json
#      and the top of SKILL.md, and add a section to CHANGELOG.md
#   2. git tag v1.1.0 && git push --tags
# This workflow then builds motion-studio.zip (the file claude.ai users upload) and publishes a GitHub Release
# whose notes are that version's CHANGELOG section.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          P=$(jq -r .version plugins/motion-studio/.claude-plugin/plugin.json)
          M=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          S=$(grep -m1 -oP '^Version \K[0-9.]+' plugins/motion-studio/skills/motion-studio/SKILL.md)
          echo "tag=$TAG plugin=$P marketplace=$M skill=$S"
          [ "$TAG" = "$P" ] && [ "$TAG" = "$M" ] && [ "$TAG" = "$S" ] || { echo "::error::version mismatch"; exit 1; }
      - name: Build skill zip
        run: |
          cp CHANGELOG.md plugins/motion-studio/skills/motion-studio/CHANGELOG.md
          mkdir -p dist && cd plugins/motion-studio/skills && zip -qr ../../../dist/motion-studio.zip motion-studio
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Claude Code / desktop:** `/plugin marketplace update bigmo-skills`  \n**claude.ai:** download `motion-studio.zip` below and upload it in Customize → Skills.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/motion-studio.zip
          body_path: notes.md
