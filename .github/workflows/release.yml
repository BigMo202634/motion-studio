# Publishing an update:
#   1. bump the version in plugins/motion-studio/.claude-plugin/plugin.json, .claude-plugin/marketplace.json
#      and the "Version" line at the top of SKILL.md, and add a section to CHANGELOG.md; commit and push
#   2. on GitHub: Releases -> Draft a new release -> tag v1.1.0 -> Publish   (or: gh release create v1.1.0)
# This workflow then attaches motion-studio.zip (the file claude.ai users upload) and fills the release notes
# from that version's CHANGELOG section.
name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check versions match the tag
        run: |
          TAG="${{ github.event.release.tag_name }}"; TAG="${TAG#v}"
          P=$(jq -r .version plugins/motion-studio/.claude-plugin/plugin.json)
          M=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          S=$(grep -m1 -oP '^Version \K[0-9.]+' plugins/motion-studio/skills/motion-studio/SKILL.md)
          echo "tag=$TAG plugin=$P marketplace=$M skill=$S"
          [ "$TAG" = "$P" ] && [ "$TAG" = "$M" ] && [ "$TAG" = "$S" ] || { echo "::error::version numbers don't match the release tag"; exit 1; }
      - name: Build skill zip
        run: |
          cp CHANGELOG.md plugins/motion-studio/skills/motion-studio/CHANGELOG.md
          mkdir -p dist && (cd plugins/motion-studio/skills && zip -qr ../../../dist/motion-studio.zip motion-studio)
      - name: Attach zip and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          awk -v v="${TAG#v}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Update in Claude Code / desktop:** `/plugin marketplace update bigmo-skills`  \n**claude.ai:** download `motion-studio.zip` below and upload it again in Customize → Skills.\n' >> notes.md
          gh release upload "$TAG" dist/motion-studio.zip --clobber
          gh release edit "$TAG" --notes-file notes.md
